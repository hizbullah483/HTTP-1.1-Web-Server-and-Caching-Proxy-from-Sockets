name: http20
topology:
  defaults:
    kind: linux
    image: cn-lab:latest
    binds:
      - ./src:/app
      - ./www:/www
      - ./captures:/captures
  nodes:
    client:
      exec:
        - ip addr add 10.10.1.10/24 dev eth1
        - ip route replace default via 10.10.1.1
    proxy:
      exec:
        - ip addr add 10.10.1.20/24 dev eth1
        - ip route replace default via 10.10.1.1
    sw:
      exec:
        - ip link add br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set br0 up
    r1:
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.10.1.1/24 dev eth1
        - ip addr add 10.10.2.1/24 dev eth2
        - ip route add 10.10.3.0/24 via 10.10.2.2
    r2:
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.10.2.2/24 dev eth1
        - ip addr add 10.10.3.1/24 dev eth2
        - ip route add 10.10.1.0/24 via 10.10.2.1
    origin:
      exec:
        - ip addr add 10.10.3.10/24 dev eth1
        - ip route replace default via 10.10.3.1
  links:
    - endpoints: ["client:eth1", "sw:eth1"]
    - endpoints: ["proxy:eth1", "sw:eth2"]
    - endpoints: ["sw:eth3", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "origin:eth1"]
